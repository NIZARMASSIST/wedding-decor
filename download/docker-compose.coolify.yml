version: '3.8'

services:
  # ===== تطبيق ألوان الخليج =====
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    environment:
      - DATABASE_URL=postgresql://wedding_user:wedding_pass_2024@db:5432/wedding_decor
      - JWT_SECRET=change-this-to-a-very-long-secret-string-2024
      - NODE_ENV=production
      - PORT=8080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===== قاعدة بيانات PostgreSQL =====
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wedding_decor
      POSTGRES_USER: wedding_user
      POSTGRES_PASSWORD: wedding_pass_2024
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedding_user -d wedding_decor"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
